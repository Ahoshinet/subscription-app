name: Build iOS IPA (Unsigned)

on:
  push:
    tags:
      - 'v*' # v1.0.0 などのタグが打たれた時に起動
  workflow_dispatch: # 手動実行（テスト用）

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write # Release への書き込み権限

    env:
      CI: '1'
      NSUnbufferedIO: 'YES'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Align Expo SDK dependency versions
        run: |
          npx expo install --fix
          pnpm list expo react react-native expo-modules-core --depth 0

      - name: Expo Prebuild (iOS)
        # --clean で生成物差分を排除し、--no-install で再インストールを避ける
        run: npx expo prebuild -p ios --clean --no-install

      - name: Install CocoaPods dependencies
        run: pod install --repo-update
        working-directory: ios

      - name: Build Xcode App (Unsigned)
        run: |
          set -o pipefail
          cd ios
          PROJECT_NAME=$(ls -d *.xcodeproj | sed 's/\.xcodeproj//')
          xcodebuild \
            -workspace "${PROJECT_NAME}.xcworkspace" \
            -scheme "${PROJECT_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            clean build 2>&1 | tee xcodebuild.log

      - name: Extract xcodebuild errors on failure
        if: failure()
        run: |
          if [ -f ios/xcodebuild.log ]; then
            echo '---- error lines ----'
            grep -n ' error:' ios/xcodebuild.log || true
            echo '---- swift compiler diagnostics ----'
            grep -n 'SwiftCompile\|SwiftEmitModule\|CompileSwift' ios/xcodebuild.log || true
          fi

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r subscription-app-unsigned.ipa Payload

      - name: Upload xcodebuild logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-logs
          path: |
            ios/xcodebuild.log
            ios/build/**/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

      # 手動実行時でもダウンロードできるようにアーティファクトとして保存
      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: subscription-app-unsigned-ipa
          path: subscription-app-unsigned.ipa
          retention-days: 7

      # CDN にアップロード
      - name: Upload IPA to CDN
        run: |
          TAG="${GITHUB_REF_NAME}"
          TIMESTAMP=$(date +'%y%m%d%H%M%S')
          if [ -n "${TAG}" ]; then
            SAFE_TAG="${TAG//\//-}"
            REMOTE_FILE="subscription-app-unsigned_${SAFE_TAG}_${TIMESTAMP}.ipa"
          else
            REMOTE_FILE="subscription-app-unsigned_${TIMESTAMP}.ipa"
          fi
          UPLOAD_URL="https://cdn.daruks.com/upload/subscription-manager/ios-ipa/${REMOTE_FILE}"

          echo "Upload URL: ${UPLOAD_URL}"
          HTTP_STATUS=$(curl -s -o response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CDN_UPLOAD_TOKEN }}" \
            -H "User-Agent: GitHub-Actions/CDN-Upload" \
            -F "file=@subscription-app-unsigned.ipa;filename=${REMOTE_FILE}" \
            "${UPLOAD_URL}")
          echo "HTTP Status: ${HTTP_STATUS}"
          cat response.json
          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "::error::CDN upload failed with status ${HTTP_STATUS}"
            exit 1
          fi

      # タグ付き push 時のみ GitHub Release を作成
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: subscription-app-unsigned.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
