name: Build iOS IPA (Unsigned)

on:
  push:
    tags:
      - 'v*' # v1.0.0 などのタグが打たれた時に起動
  workflow_dispatch: # 手動実行（テスト用）

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write # Release への書き込み権限

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo Prebuild (iOS)
        # --no-install: pnpm install 済みのため再インストールをスキップ
        run: npx expo prebuild -p ios --no-install

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: ios

      - name: Build Xcode Archive (Unsigned)
        run: |
          cd ios
          PROJECT_NAME=$(ls -d *.xcodeproj | sed 's/\.xcodeproj//')
          xcodebuild -workspace "${PROJECT_NAME}.xcworkspace" \
            -scheme "${PROJECT_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            clean build

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r subscription-app-unsigned.ipa Payload

      # 手動実行時でもダウンロードできるようにアーティファクトとして保存
      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: subscription-app-unsigned-ipa
          path: subscription-app-unsigned.ipa
          retention-days: 7

      # タグ付き push 時のみ GitHub Release を作成
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: subscription-app-unsigned.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
