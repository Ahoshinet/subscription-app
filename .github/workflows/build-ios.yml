name: Build iOS IPA (Unsigned)

on:
  push:
    tags:
      - 'v*' # v1.0.0 などのタグが打たれた時に起動
  workflow_dispatch: # 手動実行（テスト用）

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write # Release への書き込み権限

    env:
      CI: '1'
      NSUnbufferedIO: 'YES'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo Prebuild (iOS)
        # --clean で生成物差分を排除し、--no-install で再インストールを避ける
        run: npx expo prebuild -p ios --clean --no-install

      - name: Disable New Architecture for CI build
        run: |
          node -e "const fs=require('fs');const path='ios/Podfile.properties.json';const data=JSON.parse(fs.readFileSync(path,'utf8'));data.newArchEnabled='false';fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');"
          type ios\Podfile.properties.json

      - name: Install CocoaPods dependencies
        run: RCT_NEW_ARCH_ENABLED=0 pod install --repo-update
        working-directory: ios

      - name: Build Xcode App (Unsigned)
        run: |
          set -o pipefail
          cd ios
          PROJECT_NAME=$(ls -d *.xcodeproj | sed 's/\.xcodeproj//')
          xcodebuild \
            -workspace "${PROJECT_NAME}.xcworkspace" \
            -scheme "${PROJECT_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            RCT_NEW_ARCH_ENABLED=0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            clean build 2>&1 | tee xcodebuild.log

      - name: Extract xcodebuild errors on failure
        if: failure()
        run: |
          if [ -f ios/xcodebuild.log ]; then
            echo '---- error lines ----'
            grep -n ' error:' ios/xcodebuild.log || true
            echo '---- swift compiler diagnostics ----'
            grep -n 'SwiftCompile\|SwiftEmitModule\|CompileSwift' ios/xcodebuild.log || true
          fi

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r subscription-app-unsigned.ipa Payload

      - name: Upload xcodebuild logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            ios/xcodebuild.log
            ios/build/**/*.xcresult
            ios/Podfile.properties.json
          if-no-files-found: ignore
          retention-days: 7

      # 手動実行時でもダウンロードできるようにアーティファクトとして保存
      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: subscription-app-unsigned-ipa
          path: subscription-app-unsigned.ipa
          retention-days: 7

      # タグ付き push 時のみ GitHub Release を作成
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: subscription-app-unsigned.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
