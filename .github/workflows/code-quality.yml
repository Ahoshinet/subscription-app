name: Code Quality

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'

jobs:
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22.x'
        cache: 'pnpm'
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Run ESLint with reporting
      run: |
        pnpm exec eslint . --ext .js,.jsx,.ts,.tsx --format json --output-file eslint-report.json || true
        pnpm exec eslint . --ext .js,.jsx,.ts,.tsx
        
    - name: Run Prettier check
      run: pnpm exec prettier --check "**/*.{js,jsx,ts,tsx,json,css,md}"
      continue-on-error: true
      
    - name: Check TypeScript
      run: pnpm exec tsc --noEmit
      
    - name: Bundle analyzer
      run: |
        pnpm run build
        pnpm exec @next/bundle-analyzer
      continue-on-error: true
      
    - name: Upload ESLint report
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: eslint-report
        path: eslint-report.json
        retention-days: 7

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22.x'
        cache: 'pnpm'
        
    - name: Check for outdated packages
      run: |
        pnpm install --frozen-lockfile
        pnpm outdated --json > outdated-packages.json || true
        cat outdated-packages.json
        
    - name: Check package vulnerabilities
      run: |
        pnpm audit --json > security-audit.json || true
        pnpm audit
        
    - name: Upload dependency reports
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: dependency-reports
        path: |
          outdated-packages.json
          security-audit.json
        retention-days: 7

  performance-check:
    name: Performance Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22.x'
        cache: 'pnpm'
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Build project
      run: pnpm run build
      
    - name: Analyze bundle size
      run: |
        du -sh .next/static/chunks/* | sort -hr > bundle-size-report.txt
        echo "=== Bundle Size Report ===" >> bundle-analysis.txt
        cat bundle-size-report.txt >> bundle-analysis.txt
        echo "" >> bundle-analysis.txt
        echo "=== Page Sizes ===" >> bundle-analysis.txt
        find .next/static -name "*.js" -exec wc -c {} + | sort -nr >> bundle-analysis.txt
        
    - name: Upload performance report
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: performance-report
        path: |
          bundle-size-report.txt
          bundle-analysis.txt
        retention-days: 7
