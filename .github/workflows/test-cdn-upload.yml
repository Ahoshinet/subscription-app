name: Test CDN Upload

on:
  workflow_dispatch:

jobs:
  test-cdn-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Create dummy file
        run: dd if=/dev/urandom bs=1K count=64 | base64 > test-upload.ipa

      - name: Upload to CDN
        run: |
          TIMESTAMP=$(date +'%y%m%d%H%M%S')
          REMOTE_FILE="test-upload_${TIMESTAMP}.ipa"
          UPLOAD_URL="https://cdn.daruks.com/upload/subscription-manager/ios-ipa/${REMOTE_FILE}"

          echo "Upload URL: ${UPLOAD_URL}"
          HTTP_STATUS=$(curl -v -o response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CDN_UPLOAD_TOKEN }}" \
            -H "User-Agent: GitHub-Actions/CDN-Upload" \
            -F "file=@test-upload.ipa;filename=${REMOTE_FILE}" \
            "${UPLOAD_URL}")
          echo "HTTP Status: ${HTTP_STATUS}"
          cat response.json
          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "::error::CDN upload failed with status ${HTTP_STATUS}"
            exit 1
          fi
